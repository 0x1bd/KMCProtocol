[versions]
kmcprotocol = "0.1.2"
kotlin = "2.4.10"
kotlin-coroutines = "1.11.0"
kotlinx-serialization-json = "1.11.0"
ktor = "3.5.1"
adventure = "4.19.0"
knbt = "0.11.8"
minecraft = "1.21.4"
fabric-loader = "0.16.9"
fabric-api = "0.119.3+1.21.4"
yarn = "1.21.4+build.8"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlin-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }

ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-network-tls = { module = "io.ktor:ktor-network-tls", version.ref = "ktor" }

knbt = { module = "net.benwoodworth.knbt:knbt", version.ref = "knbt" }
adventure-text-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

[bundles]
kotlin-coroutines = ["kotlin-coroutines", "kotlin-coroutines-test"]
ktor = ["ktor-network", "ktor-network-tls"]
serialization = ["knbt", "adventure-text-serializer-gson", "kotlinx-serialization-json"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
fabric-loom = { id = "fabric-loom", version = "1.17.17" }
maven-publish = { id = "com.vanniktech.maven.publish.base", version = "0.36.0" }
